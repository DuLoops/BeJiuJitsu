appId: host.exp.Exponent
---
# Navigate to Log screen - reusable navigation flow

# 1. Launch app and open DoJits
- runFlow: ../smoke/app-launch.yaml

# 2. Navigate to Log screen
- tapOn:
    id: "create-tab"  # Second tab (+) button
- tapOn:
    id: "log-option" # Log option in the modal
- assertVisible: "Log"
- tapOn:
    id: "log-training-tab" # Training tab in log screen